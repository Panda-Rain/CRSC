<body class="bg-notion-bg text-gray-900 dark:bg-notion-bgDark dark:text-gray-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
      // ============================================================
      // 0. 环境与钩子
      // ============================================================
      const { useState, useEffect, useRef, useMemo, useCallback, useLayoutEffect } = React;
      const { createRoot } = ReactDOM;

      // ============================================================
      // 1. 图标（内联 SVG，避免 CDN 版本兼容问题）
      // ============================================================
      const Svg = ({ size = 20, className = "", children, ...props }) => (

      const Icons = {

        ArrowDown: (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></Svg>,
        Trash2: (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Svg>,
        Pencil: (p) => <Svg {...p}><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></Svg>,
        Download: (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></Svg>,
        Image: (p) => <Svg {...p}><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-4.6-4.6a2 2 0 0 0-2.8 0L3 21"></path></Svg>,
        FileText: (p) => <Svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></Svg>,
        Plus: (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Svg>,
        Moon: (p) => <Svg {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></Svg>,
        Sun: (p) => <Svg {...p}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></Svg>,
        Monitor: (p) => <Svg {...p}><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></Svg>,
        Network: (p) => <Svg {...p}><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></Svg>,
        GitBranch: (p) => <Svg {...p}><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></Svg>,
        LayoutGrid: (p) => <Svg {...p}><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></Svg>,
        Maximize2: (p) => <Svg {...p}><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></Svg>,
        ZoomIn: (p) => <Svg {...p}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></Svg>,
        ZoomOut: (p) => <Svg {...p}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></Svg>,
        RotateCcw: (p) => <Svg {...p}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></Svg>,
        Flag: (p) => <Svg {...p}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></Svg>,
        Check: (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"></polyline></Svg>,
        AlertTriangle: (p) => <Svg {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></Svg>,
        X: (p) => <Svg {...p}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></Svg>,
        ListTree: (p) => <Svg {...p}><path d="M21 12h-8"></path><path d="M21 6H8"></path><path d="M21 18h-8"></path><path d="M3 6v4c0 1.1.9 2 2 2h3"></path><path d="M3 10v6c0 1.1.9 2 2 2h3"></path></Svg>,
      };

      // ============================================================
      // 2. 常量
      // ============================================================
      const MS_DAY = 24 * 60 * 60 * 1000;

      // 视图模式：dayWidth = 每天像素宽度（基准密度），最终宽度 = dayWidth × 时间轴缩放倍率
      const VIEW_MODE_CONFIG = {
        Day:   { dayWidth: 40, label: '日', tip: '按日：每格 1 天，显示日期与星期' },
        Week:  { dayWidth: 22, label: '周', tip: '按周：每格 1 周，显示本周起止日期' },
        Month: { dayWidth: 10, label: '月', tip: '按月：每格 1 个月，总览全周期' },
      };

      const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

      // 时间轴缩放范围（百分比）
      const ZOOM_MIN = 0.4;
      const ZOOM_MAX = 3;

      const ROW_HEIGHT = 40;
      const HEADER_HEIGHT = 56;

      const NODE_W = 190;
      const NODE_H = 108;
      const GAP_X = 60;
      const GAP_Y = 26;

      // 网络图连线箭头的固定尺寸（userSpaceOnUse，不随线宽变化）
      const ARROW_LEN = 12;   // 沿连线方向的长度：箭头尾部 → 箭尖
      const ARROW_H = 8;      // 垂直方向的宽度

      // ============================================================
      // 3. 工具函数
      // ============================================================
      const generateId = () => Math.random().toString(36).slice(2, 10);
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      const startOfDay = (d) => {
        const r = new Date(d);
        r.setHours(0, 0, 0, 0);
        return r;
      };

      const addDays = (date, days) => {
        const r = new Date(date);
        r.setDate(r.getDate() + days);
        return r;
      };

      // 自然日差（按本地时区归零后计算，避免时区/夏令时误差）
      const diffDays = (a, b) => Math.round((startOfDay(a).getTime() - startOfDay(b).getTime()) / MS_DAY);

      const formatDate = (date) => {
        if (!date) return '';
        const d = new Date(date);
        if (isNaN(d.getTime())) return '';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      // "YYYY-MM-DD" -> 本地 0 点 Date（不要用 new Date(str)，会按 UTC 解析导致差一天）
      const parseDateInput = (v) => {
        if (!v) return null;
        const parts = String(v).split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return null;
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        return isNaN(d.getTime()) ? null : d;
      };

      const durationOf = (task) => Math.max(1, diffDays(task.end, task.start) + 1);

      // 里程碑：显式标记，或开始=结束
      const isMilestone = (task) => !!task.milestone || diffDays(task.end, task.start) === 0;

      const flattenTasks = (tasks) => {
        const sorted = [...tasks].sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        return sorted.map((task, index) => ({ ...task, index }));
      };

      // 项目时间范围（前后留出余量，便于拖拽调整）
      const getProjectDateRange = (tasks) => {
        const valid = tasks.filter(
          (t) => !isNaN(new Date(t.start).getTime()) && !isNaN(new Date(t.end).getTime())
        );
        if (valid.length === 0) {
          return { start: addDays(startOfDay(new Date()), -5), end: addDays(startOfDay(new Date()), 25) };
        }
        let min = startOfDay(valid[0].start);
        let max = startOfDay(valid[0].end);
        valid.forEach((t) => {
          const s = startOfDay(t.start);
          const e = startOfDay(t.end);
          if (s < min) min = s;
          if (e > max) max = e;
        });
        return { start: addDays(min, -4), end: addDays(max, 8) };
      };

      // 依赖成环检测：判断 taskId 是否（间接）依赖 targetDependencyId
      const hasCircularDependency = (taskId, targetDependencyId, tasks) => {
        if (taskId === targetDependencyId) return true;
        const target = tasks.find((t) => t.id === targetDependencyId);
        if (!target || !target.dependencies) return false;
        return target.dependencies.some((depId) => hasCircularDependency(taskId, depId, tasks));
      };

      // ============================================================
      // 4. 关键工作（由任务表「关键」复选框人工标注）
      //    —— 原「总时差（CPM 自动计算）」功能已取消
      // ============================================================
      const computeCritical = (tasks) => {
        const list = tasks || [];
        const critical = new Set();
        list.forEach((t) => { if (t.critical) critical.add(t.id); });

        // 关键线路连线：首尾两项都被勾选为关键工作时，该连线一并标红
        const criticalEdges = new Set();
        list.forEach((t) => {
          (t.dependencies || []).forEach((d) => {
            if (critical.has(t.id) && critical.has(d)) criticalEdges.add(d + '|' + t.id);
          });
        });

        return { critical, criticalEdges };
      };

      // ============================================================
      // 5. 网络图布局
      // ============================================================
      const computeLevels = (tasks) => {
        const ids = new Set(tasks.map((t) => t.id));
        const level = new Map();
        let guard = tasks.length * tasks.length + 20;
        let changed = true;
        while (changed && guard-- > 0) {
          changed = false;
          tasks.forEach((t) => {
            if (level.has(t.id)) return;
            const deps = (t.dependencies || []).filter((d) => ids.has(d));
            if (deps.length === 0) { level.set(t.id, 0); changed = true; return; }
            const ls = deps.map((d) => level.get(d));
            if (ls.every((l) => l !== undefined)) { level.set(t.id, Math.max(...ls) + 1); changed = true; }
          });
        }
        tasks.forEach((t) => { if (!level.has(t.id)) level.set(t.id, 0); });
        return level;
      };

      const bucketByLevel = (tasks) => {
        const level = computeLevels(tasks);
        const buckets = {};
        tasks.forEach((t) => {
          const l = level.get(t.id);
          if (!buckets[l]) buckets[l] = [];
          buckets[l].push(t);
        });
        return { level, buckets };
      };

      // 首次布局：仅在节点没有坐标时赋值
      const calculateNetworkLayout = (tasks) => {
        const { level, buckets } = bucketByLevel(tasks);
        return tasks.map((t) => {
          if (t.networkX !== undefined && t.networkY !== undefined) return t;
          const l = level.get(t.id);
          const i = buckets[l].indexOf(t);
          return { ...t, networkX: 40 + l * (NODE_W + GAP_X), networkY: 40 + i * (NODE_H + GAP_Y) };
        });
      };

      // 自动布局：按层级横向排布 + 每层纵向居中，整体更整洁
      const autoLayoutNetwork = (tasks) => {
        if (!tasks.length) return tasks;
        const { buckets } = bucketByLevel(tasks);
        const keys = Object.keys(buckets).map(Number).sort((a, b) => a - b);
        const counts = keys.map((k) => buckets[k].length);
        const maxH = Math.max(...counts) * (NODE_H + GAP_Y) - GAP_Y;
        const pos = {};
        keys.forEach((l) => {
          const arr = buckets[l];
          const h = arr.length * (NODE_H + GAP_Y) - GAP_Y;
          const top = (maxH - h) / 2;
          arr.forEach((t, i) => {
            pos[t.id] = { x: 40 + l * (NODE_W + GAP_X), y: 40 + top + i * (NODE_H + GAP_Y) };
          });
        });
        return tasks.map((t) => ({ ...t, networkX: pos[t.id].x, networkY: pos[t.id].y }));
      };

      // ============================================================
      // 6. 通用小组件
      // ============================================================
      const Toast = ({ toast }) => {
        if (!toast) return null;
        const tone = {
          info: 'bg-slate-900/95 dark:bg-slate-700/95 text-white',
          success: 'bg-emerald-600/95 text-white',
          warn: 'bg-amber-500/95 text-white',
          error: 'bg-rose-600/95 text-white',
        }[toast.type || 'info'];
        return (
          <div className="fixed bottom-6 left-0 right-0 z-[120] flex justify-center pointer-events-none px-4">
            <div className={`animate-pop px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2 ${tone}`}>
              {toast.type === 'error' || toast.type === 'warn'
                ? <Icons.AlertTriangle size={15} />
                : <Icons.Check size={15} />}
              <span>{toast.message}</span>
            </div>
          </div>
        );
      };

      const ConfirmDialog = ({ state, onClose }) => {
        if (!state) return null;
        return (
          <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-fade" onClick={onClose}>
            <div className="animate-pop bg-white dark:bg-notion-sidebarDark w-full max-w-sm rounded-xl shadow-2xl border border-notion-border dark:border-notion-borderDark overflow-hidden"
                 onClick={(e) => e.stopPropagation()}>
              <div className="p-5 flex gap-3">
                <div className="shrink-0 w-9 h-9 rounded-full bg-rose-50 dark:bg-rose-500/15 flex items-center justify-center">
                  <Icons.AlertTriangle size={18} className="text-rose-500" />
                </div>
                <div className="min-w-0">
                  <h3 className="text-sm font-semibold">{state.title}</h3>
                  <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 leading-relaxed whitespace-pre-wrap">{state.message}</p>
                </div>
              </div>
              <div className="px-5 pb-5 flex justify-end gap-2">
                <button onClick={onClose} className="px-3.5 py-1.5 text-sm rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition">取消</button>
                <button onClick={() => { const f = state.onConfirm; onClose(); if (f) f(); }}
                        className="px-3.5 py-1.5 text-sm rounded-lg bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition">
                  {state.confirmText || '确定'}
                </button>
              </div>
            </div>
          </div>
        );
      };

      // 关键词高亮
      const Highlight = ({ text, query }) => {
        const str = text == null ? '' : String(text);
        const q = (query || '').trim();
        if (!q) return <React.Fragment>{str}</React.Fragment>;
        const i = str.toLowerCase().indexOf(q.toLowerCase());
        if (i === -1) return <React.Fragment>{str}</React.Fragment>;
        return (
          <React.Fragment>
            {str.slice(0, i)}
            <mark className="bg-amber-200 dark:bg-amber-400/30 text-inherit rounded-[3px] px-0.5">{str.slice(i, i + q.length)}</mark>
            {str.slice(i + q.length)}
          </React.Fragment>
        );
      };

      // ============================================================
      // 7. 组件: 任务编辑弹窗
      // ============================================================
      const TaskModal = ({ isOpen, onClose, onSave, task, allTasks, onDelete }) => {
        const [form, setForm] = useState(null);

        useEffect(() => {
          if (!isOpen) return;
          if (task) {
            setForm({
              name: task.name || '',
              content: task.content || '',
              start: startOfDay(task.start),
              end: startOfDay(task.end),
              progress: clamp(task.progress || 0, 0, 100),
              dependencies: [...(task.dependencies || [])],
              milestone: !!task.milestone,
              critical: !!task.critical,
            });
          } else {
            const t = startOfDay(new Date());
            setForm({ name: '', content: '', start: t, end: addDays(t, 2), progress: 0, dependencies: [], milestone: false, critical: false });
          }
        }, [isOpen, task]);

        useEffect(() => {
          if (!isOpen) return;
          const onKey = (e) => { if (e.key === 'Escape') onClose(); };
          window.addEventListener('keydown', onKey);
          return () => window.removeEventListener('keydown', onKey);
        }, [isOpen, onClose]);

        if (!isOpen || !form) return null;

        const dur = Math.max(1, diffDays(form.end, form.start) + 1);
        const set = (patch) => setForm((p) => ({ ...p, ...patch }));

        const onDate = (key) => (e) => {
          const d = parseDateInput(e.target.value);
          if (!d) return;
          setForm((p) => {
            const next = { ...p, [key]: d };
            if (p.milestone) { next.start = d; next.end = d; }
            else if (key === 'start' && next.end < next.start) next.end = next.start;
            else if (key === 'end' && next.end < next.start) next.start = next.end;
            return next;
          });
        };

        const toggleDep = (id) => setForm((p) => ({
          ...p,
          dependencies: p.dependencies.includes(id)
            ? p.dependencies.filter((x) => x !== id)
            : [...p.dependencies, id],
        }));

        const submit = (e) => {
          e.preventDefault();
          const name = (form.name || '').trim();
          if (!name) return;
          const payload = { ...form, name, milestone: !!form.milestone, critical: !!form.critical };
          if (payload.milestone) { payload.end = payload.start; }
          if (payload.end < payload.start) payload.end = payload.start;
          onSave(payload);
          onClose();
        };

        const others = allTasks.filter((t) => t.id !== (task && task.id));

        return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-fade"
               onClick={onClose}>
            <div className="animate-pop bg-white dark:bg-notion-sidebarDark w-full max-w-lg rounded-xl shadow-2xl border border-notion-border dark:border-notion-borderDark overflow-hidden flex flex-col max-h-[88vh]"
                 onClick={(e) => e.stopPropagation()}>
              <div className="flex justify-between items-center px-5 py-3.5 border-b border-notion-border dark:border-notion-borderDark">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-blue-50 dark:bg-blue-500/15 flex items-center justify-center">
                    {form.milestone ? <Icons.Flag size={14} className="text-amber-500" /> : <Icons.ListTree size={14} className="text-blue-600 dark:text-blue-400" />}
                  </div>
                  <h2 className="text-base font-semibold">{task ? '编辑任务' : '新建任务'}</h2>
                </div>
                <button onClick={onClose} className="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition" title="关闭 (Esc)">
                  <Icons.X size={17} className="text-gray-500" />
                </button>
              </div>

              <form onSubmit={submit} className="p-5 space-y-4 overflow-y-auto custom-scrollbar">
                <div>
                  <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 mb-1.5">任务名称 <span className="text-rose-500">*</span></label>
                  <input required autoFocus name="name" value={form.name}
                         onChange={(e) => set({ name: e.target.value })}
                         className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 transition"
                         placeholder="例如：BAS 桥架安装" />
                </div>

                <div>
                  <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 mb-1.5">任务内容 / 施工要点</label>
                  <textarea name="content" rows={2} value={form.content}
                            onChange={(e) => set({ content: e.target.value })}
                            className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 resize-none transition"
                            placeholder="可写施工内容、验收标准、责任人等" />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 mb-1.5">开始日期</label>
                    <div className="relative">
                      <input type="date" value={formatDate(form.start)} disabled={form.milestone}
                             onChange={onDate('start')}
                             className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 disabled:opacity-60 transition" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 mb-1.5">结束日期</label>
                    <div className="relative">
                      <input type="date" value={formatDate(form.end)} disabled={form.milestone}
                             onChange={onDate('end')}
                             className="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400 disabled:opacity-60 transition" />
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between rounded-lg bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 px-3 py-2">
                  <label className="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" checked={form.milestone}
                           onChange={(e) => setForm((p) => {
                             const on = e.target.checked;
                             return { ...p, milestone: on, end: on ? p.start : addDays(p.start, 2) };
                           })}
                           className="w-4 h-4 rounded accent-amber-500" />
                    <span className="text-xs font-medium text-gray-700 dark:text-gray-200">设为里程碑（单日节点）</span>
                  </label>
                  <span className="text-xs text-gray-500 dark:text-gray-400 tabular-nums">
                    {form.milestone ? '节点' : `工期 ${dur} 天`}
                  </span>
                </div>

                <div className="flex items-center justify-between rounded-lg bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 px-3 py-2">
                  <label className="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" checked={!!form.critical}
                           onChange={(e) => set({ critical: e.target.checked })}
                           className="w-4 h-4 rounded accent-rose-500" />
                    <span className="text-xs font-medium text-gray-700 dark:text-gray-200">设为关键工作</span>
                  </label>
                  <span className="text-xs text-gray-500 dark:text-gray-400">
                    {form.critical ? '甘特图 / 网络图标红' : '一般工作'}
                  </span>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1.5">
                    <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400">进度完成度</label>
                    <span className="text-xs font-bold text-blue-600 dark:text-blue-400 tabular-nums">{form.progress}%</span>
                  </div>
                  <input type="range" min="0" max="100" step="5" value={form.progress}
                         onChange={(e) => set({ progress: parseInt(e.target.value, 10) })}
                         className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                </div>

                <div>
                  <label className="block text-[11px] font-semibold text-gray-500 dark:text-gray-400 mb-1.5">
                    紧前任务（前置依赖）
                    {form.dependencies.length > 0 && <span className="ml-2 text-blue-600 dark:text-blue-400">已选 {form.dependencies.length} 项</span>}
                  </label>
                  {others.length === 0 ? (
                    <p className="text-xs text-gray-400 py-2">暂无其他任务可选</p>
                  ) : (
                    <div className="max-h-40 overflow-y-auto custom-scrollbar rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/40 p-1.5 space-y-0.5">
                      {others.map((t) => {
                        const bad = task ? hasCircularDependency(task.id, t.id, allTasks) : false;
                        const checked = form.dependencies.includes(t.id);
                        return (
                          <label key={t.id}
                                 className={`flex items-center gap-2 px-2 py-1.5 rounded-md text-xs transition ${bad ? 'opacity-45 cursor-not-allowed' : 'cursor-pointer hover:bg-white dark:hover:bg-gray-700/60'}`}
                                 title={bad ? '会形成循环依赖，不可选择' : (t.content || t.name)}>
                            <input type="checkbox" checked={checked} disabled={bad}
                                   onChange={() => toggleDep(t.id)}
                                   className="w-3.5 h-3.5 rounded accent-blue-600" />
                            <span className="truncate text-gray-700 dark:text-gray-200">{t.name}</span>
                            <span className="ml-auto text-[10px] text-gray-400 tabular-nums shrink-0">{formatDate(t.start)}</span>
                          </label>
                        );
                      })}
                    </div>
                  )}
                  <p className="text-[11px] text-gray-400 mt-1.5">完成–开始（FS）关系：前置任务结束后，本任务方可开始</p>
                </div>

                <div className="flex items-center justify-end gap-3 pt-3 border-t border-notion-border dark:border-notion-borderDark">
                  {task && onDelete && (
                    <button type="button" onClick={() => { onDelete(task.id); onClose(); }}
                            className="px-3.5 py-2 text-sm text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg transition mr-auto flex items-center gap-1.5">
                      <Icons.Trash2 size={14} /> 删除任务
                    </button>
                  )}
                  <button type="button" onClick={onClose}
                          className="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition">
                    取消
                  </button>
                  <button type="submit"
                          className="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition active:scale-95">
                    {task ? '保存修改' : '创建任务'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      // ============================================================
      // 8. 组件: 甘特图
      // ============================================================
      const GanttChart = ({
        tasks, viewMode, onTaskUpdate, onEditTask, onReorderTasks, onMoveTask, onDeleteTask,
        schedule, showCritical, searchQuery,
        sidebarWidth, setSidebarWidth, colWidths, setColWidths,
      }) => {
        const config = VIEW_MODE_CONFIG[viewMode];

        // 时间轴缩放倍率（滑块控制），最终每天像素 = 基准密度 × 倍率
        const [timeZoom, setTimeZoom] = useState(1);
        const dayWidth = Math.round(config.dayWidth * timeZoom * 100) / 100;

        const [contextMenu, setContextMenu] = useState(null);
        const [draggingRowId, setDraggingRowId] = useState(null);
        const [isDraggingBar, setIsDraggingBar] = useState(false);
        const [hoverId, setHoverId] = useState(null);

        const containerRef = useRef(null);
        const sideHeadRef = useRef(null);
        const sideRowsRef = useRef(null);
        const chartHeadRef = useRef(null);
        const chartBodyRef = useRef(null);
        const resizeRef = useRef(null);
        const dragRef = useRef(null);

        const flatTasks = useMemo(() => flattenTasks(tasks), [tasks]);
        const dateRange = useMemo(() => getProjectDateRange(tasks), [tasks]);
        const totalDays = Math.max(1, diffDays(dateRange.end, dateRange.start) + 1);
        const chartWidth = totalDays * dayWidth;
        const totalColWidth = Object.keys(colWidths).reduce((a, k) => a + colWidths[k], 0);
        // gridHeight：最后一个任务行的底边 —— 竖向网格线、周末底色、今天列都只画到这里，
        // 保证与左侧任务表行数严格对齐（不再多出空白格子）。
        const gridHeight = flatTasks.length * ROW_HEIGHT;
        // contentHeight：网格 + 一行"新建任务"行，作为滚动区高度。
        const contentHeight = Math.max(gridHeight + ROW_HEIGHT, 320);

        // 全局鼠标事件里读取的最新值（避免闭包捕获旧数据）
        const live = useRef({});
        live.current = { tasks, dayWidth, dateRange, onTaskUpdate };

        // ---------- 时间轴缩放（滑块） ----------
        // 缩放时保持"视口中点对应的日期"不动，避免画面乱跳
        const zoomAnchorRef = useRef(null);

        const applyTimeZoom = (next) => {
          const v = clamp(Math.round(next * 100) / 100, ZOOM_MIN, ZOOM_MAX);
          if (Math.abs(v - timeZoom) < 0.001) return;
          const body = chartBodyRef.current;
          if (body && body.clientWidth) {
            zoomAnchorRef.current = { center: body.scrollLeft + body.clientWidth / 2, ratio: v / timeZoom };
          } else {
            zoomAnchorRef.current = null;
          }
          setTimeZoom(v);
        };

        useLayoutEffect(() => {
          const a = zoomAnchorRef.current;
          zoomAnchorRef.current = null;
          const body = chartBodyRef.current;
          if (!a || !body) return;
          body.scrollLeft = Math.max(0, a.center * a.ratio - body.clientWidth / 2);
          if (chartHeadRef.current) chartHeadRef.current.scrollLeft = body.scrollLeft;
        }, [timeZoom]);

        // 切换 日 / 周 / 月 时，缩放倍率回到 100%
        useEffect(() => { applyTimeZoom(1); }, [viewMode]);

        // ---------- 拖拽调整任务条 ----------
        const applyTaskDrag = (e) => {
          const d = dragRef.current;
          if (!d) return;
          const cur = live.current;
          const task = cur.tasks.find((t) => t.id === d.taskId);
          if (!task) return;
          const daysDelta = Math.round((e.clientX - d.startX) / cur.dayWidth);
          const timeDelta = daysDelta * MS_DAY;
          let newStart = new Date(d.originalStart + timeDelta);
          let newEnd = new Date(d.originalEnd + timeDelta);
          let milestone = !!task.milestone;

          if (d.type === 'resize-left') {
            if (newStart >= newEnd) newStart = addDays(newEnd, -1);
            milestone = false;
          } else if (d.type === 'resize-right') {
            if (newEnd <= newStart) newEnd = addDays(newStart, 1);
            milestone = false;
          }
          if (task.start.getTime() === newStart.getTime() && task.end.getTime() === newEnd.getTime() && milestone === !!task.milestone) return;
          cur.onTaskUpdate({ ...task, start: newStart, end: newEnd, milestone });
        };

        const startBarDrag = (e, task, type) => {
          e.stopPropagation();
          e.preventDefault();
          dragRef.current = {
            taskId: task.id, type, startX: e.clientX,
            originalStart: startOfDay(task.start).getTime(),
            originalEnd: startOfDay(task.end).getTime(),
          };
          setIsDraggingBar(true);
        };

        const startColResize = (e, col) => {
          e.preventDefault();
          e.stopPropagation();
          resizeRef.current = { kind: 'col', col, startX: e.clientX, startWidth: colWidths[col] };
        };

        const startSidebarResize = (e) => {
          e.preventDefault();
          resizeRef.current = { kind: 'sidebar' };
        };

        // 全局监听（只注册一次）
        useEffect(() => {
          const onMove = (e) => {
            const r = resizeRef.current;
            if (r && r.kind === 'sidebar' && containerRef.current) {
              const rect = containerRef.current.getBoundingClientRect();
              setSidebarWidth(clamp(e.clientX - rect.left + 2, 260, Math.max(280, rect.width - 240)));
            } else if (r && r.kind === 'col') {
              const next = Math.max(38, r.startWidth + (e.clientX - r.startX));
              setColWidths((prev) => (prev[r.col] === next ? prev : { ...prev, [r.col]: next }));
            } else if (dragRef.current) {
              applyTaskDrag(e);
            }
          };
          const onUp = () => {
            resizeRef.current = null;
            if (dragRef.current) { dragRef.current = null; setIsDraggingBar(false); }
          };
          const onClick = () => setContextMenu(null);
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          window.addEventListener('click', onClick);
          return () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            window.removeEventListener('click', onClick);
          };
        }, []);

        // ---------- 滚动同步（修复侧栏与图表错位） ----------
        const onSideScroll = (e) => {
          const el = e.currentTarget;
          if (sideHeadRef.current) sideHeadRef.current.scrollLeft = el.scrollLeft;
          if (chartBodyRef.current) chartBodyRef.current.scrollTop = el.scrollTop;
        };
        const onChartScroll = (e) => {
          const el = e.currentTarget;
          if (chartHeadRef.current) chartHeadRef.current.scrollLeft = el.scrollLeft;
          if (sideRowsRef.current) sideRowsRef.current.scrollTop = el.scrollTop;
        };

        // ---------- 表头数据 ----------
        // 第一行（分组行）：日/周视图按月分组，月视图按年分组
        const topSegments = useMemo(() => {
          const byYear = viewMode === 'Month';
          const segs = [];
          let cur = startOfDay(dateRange.start);
          const last = startOfDay(dateRange.end);
          while (cur <= last) {
            const naturalEnd = byYear
              ? new Date(cur.getFullYear(), 11, 31)
              : new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
            const segEnd = naturalEnd < last ? naturalEnd : last;
            segs.push({
              key: cur.getTime(),
              left: diffDays(cur, dateRange.start) * dayWidth,
              width: (diffDays(segEnd, cur) + 1) * dayWidth,
              label: byYear ? `${cur.getFullYear()}年` : `${cur.getFullYear()}年${cur.getMonth() + 1}月`,
            });
            cur = addDays(segEnd, 1);
          }
          return segs;
        }, [dateRange, dayWidth, viewMode]);

        // 逐日的周末信息（用于周末底色）
        const dayFlags = useMemo(() => {
          const out = [];
          let cur = startOfDay(dateRange.start);
          const last = startOfDay(dateRange.end);
          while (cur <= last) {
            const idx = diffDays(cur, dateRange.start);
            const dow = cur.getDay();
            out.push({ idx, left: idx * dayWidth, weekend: dow === 0 || dow === 6 });
            cur = addDays(cur, 1);
          }
          return out;
        }, [dateRange, dayWidth]);

        // 时间刻度单元格：日 = 1 格/天，周 = 1 格/周，月 = 1 格/月
        // 三种视图都渲染完整的时间文字与格线
        const unitCells = useMemo(() => {
          const cells = [];
          const first = startOfDay(dateRange.start);
          const last = startOfDay(dateRange.end);
          const at = (d) => diffDays(d, first);

          if (viewMode === 'Day') {
            let cur = first;
            while (cur <= last) {
              const i = at(cur);
              const dow = cur.getDay();
              cells.push({
                key: 'd' + i, left: i * dayWidth, width: dayWidth,
                label: String(cur.getDate()), sub: WEEKDAYS[dow],
                full: `${formatDate(cur)}（周${WEEKDAYS[dow]}）`,
              });
              cur = addDays(cur, 1);
            }
            return cells;
          }

          if (viewMode === 'Week') {
            let cur = first;
            while (cur <= last) {
              const offset = (cur.getDay() + 6) % 7; // 周一 = 0
              const naturalEnd = addDays(cur, 6 - offset);
              const segEnd = naturalEnd < last ? naturalEnd : last;
              const i = at(cur);
              cells.push({
                key: 'w' + i, left: i * dayWidth, width: (at(segEnd) - i + 1) * dayWidth,
                label: `${cur.getMonth() + 1}/${cur.getDate()} ~ ${segEnd.getMonth() + 1}/${segEnd.getDate()}`,
                short: `${cur.getMonth() + 1}/${cur.getDate()}`,
                full: `${formatDate(cur)} ~ ${formatDate(segEnd)}`,
              });
              cur = addDays(segEnd, 1);
            }
            return cells;
          }

          let cur = first;
          while (cur <= last) {
            const monthEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
            const segEnd = monthEnd < last ? monthEnd : last;
            const i = at(cur);
            cells.push({
              key: 'm' + i, left: i * dayWidth, width: (at(segEnd) - i + 1) * dayWidth,
              label: `${cur.getFullYear()}年${cur.getMonth() + 1}月`,
              full: `${cur.getFullYear()}年${cur.getMonth() + 1}月（${formatDate(cur)} ~ ${formatDate(segEnd)}）`,
            });
            cur = addDays(segEnd, 1);
          }
          return cells;
        }, [dateRange, dayWidth, viewMode]);

        const todayIdx = diffDays(new Date(), dateRange.start);
        const showToday = todayIdx >= 0 && todayIdx < totalDays;

        // ---------- 依赖连线 ----------
        const buildDepPath = (dep, cur) => {
          const x1 = (diffDays(dep.end, dateRange.start) + 1) * dayWidth;
          const y1 = dep.index * ROW_HEIGHT + ROW_HEIGHT / 2;
          const x2 = diffDays(cur.start, dateRange.start) * dayWidth;
          const y2 = cur.index * ROW_HEIGHT + ROW_HEIGHT / 2;
          if (x2 - x1 >= 20) {
            const c = Math.max(14, Math.min(64, (x2 - x1) / 2));
            return `M ${x1} ${y1} C ${x1 + c} ${y1}, ${x2 - c} ${y2}, ${x2} ${y2}`;
          }
          const elbow = x1 + 14;
          return `M ${x1} ${y1} L ${elbow} ${y1} L ${elbow} ${y2} L ${x2} ${y2}`;
        };

        const renderDependencies = () => tasks.flatMap((task) =>
          (task.dependencies || []).map((depId) => {
            const dep = flatTasks.find((t) => t.id === depId);
            const cur = flatTasks.find((t) => t.id === task.id);
            if (!dep || !cur) return null;
            const crit = showCritical && schedule.criticalEdges.has(depId + '|' + task.id);
            return (
              <path key={depId + '-' + task.id}
                    d={buildDepPath(dep, cur)}
                    stroke={crit ? '#f43f5e' : 'currentColor'}
                    strokeWidth={crit ? 2 : 1.4}
                    strokeDasharray={crit ? undefined : '5 3'}
                    fill="none"
                    markerEnd={crit ? 'url(#arrowCrit)' : 'url(#arrowNorm)'}
                    opacity={crit ? 1 : 0.7} />
            );
          })
        );

        // ---------- 行拖拽排序 ----------
        const handleRowDrop = (e, targetId) => {
          e.preventDefault();
          const sourceId = e.dataTransfer.getData('text/plain');
          setDraggingRowId(null);
          if (sourceId && sourceId !== targetId) onReorderTasks(sourceId, targetId);
        };

        const handleContextMenu = (e, taskId) => {
          e.preventDefault();
          setContextMenu({ x: Math.min(e.clientX, window.innerWidth - 168), y: Math.min(e.clientY, window.innerHeight - 210), taskId });
        };

        // ---------- 侧栏列头 ----------
        const HeadCell = ({ col, label, center }) => (
          <div className={`relative flex items-center h-full shrink-0 border-r border-notion-border dark:border-notion-borderDark ${center ? 'justify-center' : 'px-2.5'}`}
               style={{ width: colWidths[col] }}>
