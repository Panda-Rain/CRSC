      // ============================================================
      // 9. 组件: 网络图（单代号网络计划）
      // ============================================================
      const NetworkDiagram = ({ tasks, onTaskUpdate, onEditTask, onTaskLayout, schedule, showCritical, searchQuery, dimmedIds, onToast }) => {
        const [offset, setOffset] = useState({ x: 0, y: 0 });
        const [zoom, setZoom] = useState(1);
        const [panning, setPanning] = useState(false);
        const [dragNodeId, setDragNodeId] = useState(null);
        const [connectingSourceId, setConnectingSourceId] = useState(null);
        const [tempMousePos, setTempMousePos] = useState(null);
        const [snapLines, setSnapLines] = useState(null);
        const [hoverNodeId, setHoverNodeId] = useState(null);

        const containerRef = useRef(null);
        const panRef = useRef(null);
        const nodeDragRef = useRef(null);
        const connectRef = useRef(null);

        const zoomRef = useRef(zoom); zoomRef.current = zoom;
        const offsetRef = useRef(offset); offsetRef.current = offset;
        const live = useRef({}); live.current = { tasks, onTaskUpdate, onToast };
        const SNAP = 12;

        // 屏幕坐标 -> 画布坐标
        const toWorld = (clientX, clientY) => {
          const el = containerRef.current;
          if (!el) return { x: 0, y: 0 };
          const rect = el.getBoundingClientRect();
          const o = offsetRef.current, z = zoomRef.current;
          return { x: (clientX - rect.left - o.x) / z, y: (clientY - rect.top - o.y) / z };
        };

        const zoomAt = useCallback((factor, clientX, clientY) => {
          const el = containerRef.current;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const px = clientX - rect.left, py = clientY - rect.top;
          const z = zoomRef.current;
          const nz = clamp(z * factor, 0.22, 2.5);
          if (Math.abs(nz - z) < 0.001) return;
          const o = offsetRef.current;
          setOffset({ x: px - (px - o.x) * (nz / z), y: py - (py - o.y) * (nz / z) });
          setZoom(nz);
        }, []);

        const fitView = useCallback(() => {
          const el = containerRef.current;
          const list = live.current.tasks;
          if (!el || !list.length) return;
          const rect = el.getBoundingClientRect();
          const pad = 56;
          let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
          list.forEach((t) => {
            const x = t.networkX || 0, y = t.networkY || 0;
            minX = Math.min(minX, x); minY = Math.min(minY, y);
            maxX = Math.max(maxX, x + NODE_W); maxY = Math.max(maxY, y + NODE_H);
          });
          const bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
          const z = clamp(Math.min((rect.width - pad * 2) / bw, (rect.height - pad * 2) / bh), 0.22, 1.1);
          setZoom(z);
          setOffset({ x: (rect.width - bw * z) / 2 - minX * z, y: (rect.height - bh * z) / 2 - minY * z });
        }, []);

        const resetView = useCallback(() => {
          setZoom(1);
          setOffset({ x: 40, y: 20 });
        }, []);

        // 每次进入网络计划图视图时自动适应，保证所有节点都在画面内
        useEffect(() => {
          const timer = setTimeout(() => fitView(), 80);
          return () => clearTimeout(timer);
        }, [fitView]);

        // 滚轮：Ctrl/⌘+滚轮缩放，普通滚轮平移
        useEffect(() => {
          const el = containerRef.current;
          if (!el) return;
          const onWheel = (e) => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
              zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
            } else {
              setOffset((o) => ({ x: o.x - (e.deltaX || 0), y: o.y - e.deltaY }));
            }
          };
          el.addEventListener('wheel', onWheel, { passive: false });
          return () => el.removeEventListener('wheel', onWheel);
        }, [zoomAt]);

        // 全局鼠标（平移 / 拖动节点 / 连线预览）
        useEffect(() => {
          const onMove = (e) => {
            const st = live.current;
            if (panRef.current) {
              const dx = e.clientX - panRef.current.x;
              const dy = e.clientY - panRef.current.y;
              panRef.current = { x: e.clientX, y: e.clientY };
              setOffset((o) => ({ x: o.x + dx, y: o.y + dy }));
            }
            if (nodeDragRef.current) {
              const d = nodeDragRef.current;
              const z = zoomRef.current;
              let nx = d.originX + (e.clientX - d.startX) / z;
              let ny = d.originY + (e.clientY - d.startY) / z;
              let snap = null;
              st.tasks.forEach((o) => {
                if (o.id === d.id) return;
                const ox = o.networkX || 0, oy = o.networkY || 0;
                if (Math.abs(nx - ox) < SNAP) { nx = ox; snap = Object.assign(snap || {}, { x: ox }); }
                if (Math.abs(ny - oy) < SNAP) { ny = oy; snap = Object.assign(snap || {}, { y: oy }); }
              });
              setSnapLines(snap);
              const t = st.tasks.find((x) => x.id === d.id);
              if (t && ((t.networkX || 0) !== nx || (t.networkY || 0) !== ny)) {
                st.onTaskUpdate({ ...t, networkX: nx, networkY: ny });
              }
            }
            if (connectRef.current) setTempMousePos(toWorld(e.clientX, e.clientY));
          };
          const onUp = () => {
            panRef.current = null; setPanning(false);
            nodeDragRef.current = null; setDragNodeId(null); setSnapLines(null);
            if (connectRef.current) { connectRef.current = null; setConnectingSourceId(null); setTempMousePos(null); }
          };
          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          return () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
          };
        }, []);

        const onCanvasDown = (e) => {
          if (e.button !== 0) return;
          if (dragNodeId || connectRef.current) return;
          panRef.current = { x: e.clientX, y: e.clientY };
          setPanning(true);
        };

        const onNodeDown = (e, task) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          if (connectRef.current) return;
          nodeDragRef.current = { id: task.id, startX: e.clientX, startY: e.clientY, originX: task.networkX || 0, originY: task.networkY || 0 };
          setDragNodeId(task.id);
        };

        const onConnectorDown = (e, taskId) => {
          e.stopPropagation();
          e.preventDefault();
          connectRef.current = taskId;
          setConnectingSourceId(taskId);
          setTempMousePos(toWorld(e.clientX, e.clientY));
        };

        const onNodeUp = (e, target) => {
          const src = connectRef.current;
          if (!src) return;
          e.stopPropagation();
          connectRef.current = null;
          setConnectingSourceId(null);
          setTempMousePos(null);
          const st = live.current;
          const srcTask = st.tasks.find((t) => t.id === src);
          if (src === target.id) return;
          if ((target.dependencies || []).includes(src)) { st.onToast('该依赖关系已存在', 'warn'); return; }
          if (hasCircularDependency(src, target.id, st.tasks)) { st.onToast('无法连接：会形成循环依赖', 'error'); return; }
          st.onTaskUpdate({ ...target, dependencies: [...(target.dependencies || []), src] });
          st.onToast(`已建立依赖：${srcTask ? srcTask.name : ''} → ${target.name}`, 'success');
        };

        // 连线路径
        // 终点取「任务块左边缘再往回退 ARROW_LEN」，即连线正好收在箭头尾部；
        // 箭尖由 marker 从尾端自行向前延伸 ARROW_LEN，刚好落在任务块左边缘上。
        const buildPath = (from, to) => {
          const sx = (from.networkX || 0) + NODE_W;
          const sy = (from.networkY || 0) + NODE_H / 2;
          const ex = (to.networkX || 0) - ARROW_LEN;
          const ey = (to.networkY || 0) + NODE_H / 2;
          if (ex - sx >= 30) {
            const c = Math.max(20, Math.min(80, (ex - sx) / 2));
            return `M ${sx} ${sy} C ${sx + c} ${sy}, ${ex - c} ${ey}, ${ex} ${ey}`;
          }
          const elbow = sx + 22;
          return `M ${sx} ${sy} C ${sx + 14} ${sy}, ${elbow} ${sy}, ${elbow} ${(sy + ey) / 2} C ${elbow} ${ey}, ${ex - 14} ${ey}, ${ex} ${ey}`;
        };

        const renderConnections = () => tasks.flatMap((task) =>
          (task.dependencies || []).map((depId) => {
            const dep = tasks.find((t) => t.id === depId);
            if (!dep) return null;
            const crit = showCritical && schedule.criticalEdges.has(depId + '|' + task.id);
            return (
              <path key={depId + '-' + task.id}
                    d={buildPath(dep, task)}
                    fill="none"
                    stroke={crit ? '#f43f5e' : 'currentColor'}
                    strokeWidth={crit ? 2.2 : 1.5}
                    strokeLinecap={crit ? 'butt' : 'round'}
                    strokeDasharray={crit ? undefined : '6 4'}
                    markerEnd={crit ? 'url(#netArrowCrit)' : 'url(#netArrowNormal)'} />
            );
          })
        );

        const renderTempConnection = () => {
          if (!connectingSourceId || !tempMousePos) return null;
          const src = tasks.find((t) => t.id === connectingSourceId);
          if (!src) return null;
          const sx = (src.networkX || 0) + NODE_W;
          const sy = (src.networkY || 0) + NODE_H / 2;
          return (
            <path d={`M ${sx} ${sy} L ${tempMousePos.x} ${tempMousePos.y}`}
                  fill="none" stroke="#3b82f6" strokeWidth="2" strokeDasharray="5 4"
                  markerEnd="url(#netArrowActive)" className="pointer-events-none" />
          );
        };

        return (
          <div ref={containerRef}
               className="w-full h-full overflow-hidden relative select-none"
               style={{ cursor: panning ? 'grabbing' : 'grab', background: 'transparent' }}
               onMouseDown={onCanvasDown}>
            {/* 网格背景 */}
            <div className="absolute inset-0 pointer-events-none opacity-[0.14] dark:opacity-[0.10]"
                 style={{
                   backgroundImage: 'radial-gradient(currentColor 1px, transparent 1px)',
                   backgroundSize: `${20 * zoom}px ${20 * zoom}px`,
                   backgroundPosition: `${offset.x}px ${offset.y}px`,
                 }} />

            {/* 画布内容 */}
            <div className="absolute inset-0 w-full h-full pointer-events-none"
                 style={{ transform: `translate(${offset.x}px, ${offset.y}px) scale(${zoom})`, transformOrigin: '0 0' }}>
              <svg className="absolute inset-0 overflow-visible pointer-events-none text-slate-400 dark:text-slate-500">
                <defs>
                  {/* markerUnits=userSpaceOnUse：箭头固定为 ARROW_LEN×ARROW_H，不再随线宽缩放；
                      refX=0 表示把「箭头尾部」对准连线终点，箭尖由此自动向前伸 ARROW_LEN */}
                  <marker id="netArrowNormal" markerUnits="userSpaceOnUse" markerWidth={ARROW_LEN} markerHeight={ARROW_H} refX="0" refY={ARROW_H / 2} orient="auto">
                    <polygon points={`0 0, ${ARROW_LEN} ${ARROW_H / 2}, 0 ${ARROW_H}`} fill="#94a3b8" />
                  </marker>
                  <marker id="netArrowCrit" markerUnits="userSpaceOnUse" markerWidth={ARROW_LEN} markerHeight={ARROW_H} refX="0" refY={ARROW_H / 2} orient="auto">
                    <polygon points={`0 0, ${ARROW_LEN} ${ARROW_H / 2}, 0 ${ARROW_H}`} fill="#f43f5e" />
                  </marker>
                  {/* 拖拽预览线：箭尖需跟随鼠标，故 refX 取箭头全长（尾端自动后移） */}
                  <marker id="netArrowActive" markerUnits="userSpaceOnUse" markerWidth={ARROW_LEN} markerHeight={ARROW_H} refX={ARROW_LEN} refY={ARROW_H / 2} orient="auto">
                    <polygon points={`0 0, ${ARROW_LEN} ${ARROW_H / 2}, 0 ${ARROW_H}`} fill="#3b82f6" />
                  </marker>
                </defs>
                {renderConnections()}
                {renderTempConnection()}
              </svg>

              {/* 节点 */}
              {tasks.map((task) => {
                const crit = showCritical && schedule.critical.has(task.id);
                const ms = isMilestone(task);
                const pct = clamp(task.progress || 0, 0, 100);
                const marked = !!task.critical;
                const succCount = tasks.filter((t) => (t.dependencies || []).includes(task.id)).length;
                const isDim = dimmedIds && dimmedIds.has(task.id);
                const isDrag = dragNodeId === task.id;
                const isConnect = connectingSourceId === task.id;
                const isHover = hoverNodeId === task.id;
                return (
                  <div key={task.id}
                       className={`absolute rounded-xl border bg-white dark:bg-notion-sidebarDark pointer-events-auto transition-shadow
                         ${isDim ? 'opacity-25' : 'opacity-100'}
                         ${isDrag ? 'shadow-2xl' : 'shadow-sm'}
                         ${crit ? 'border-rose-300 dark:border-rose-500/60' : 'border-notion-border dark:border-notion-borderDark'}
                         ${isHover ? 'shadow-lg ring-2 ' + (crit ? 'ring-rose-300/70 dark:ring-rose-500/40' : 'ring-blue-300/70 dark:ring-blue-500/40') : ''}
                         ${isConnect ? 'ring-2 ring-blue-500' : ''}`}
                       style={{
                         left: task.networkX || 0,
                         top: task.networkY || 0,
                         width: NODE_W,
                         height: NODE_H,
                         zIndex: isDrag ? 60 : (isHover ? 40 : 10),
                       }}
                       onMouseDown={(e) => onNodeDown(e, task)}
                       onMouseUp={(e) => onNodeUp(e, task)}
                       onDoubleClick={() => onEditTask(task)}
                       onMouseEnter={() => setHoverNodeId(task.id)}
                       onMouseLeave={() => setHoverNodeId(null)}
                       title={`${task.name}\n双击编辑 · 拖动移动 · 悬停右侧圆点连线`}>
                    <div className={`h-1.5 w-full rounded-t-xl ${crit ? 'bg-rose-500' : ms ? 'bg-amber-400' : 'bg-blue-500'}`} />
                    <div className="px-3 pt-2 pb-2.5 flex flex-col h-[calc(100%-6px)]">
                      <div className="flex items-start gap-1.5">
                        <h3 className="flex-1 font-semibold text-[12.5px] leading-snug text-gray-800 dark:text-gray-100"
                            style={{ display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
                          <Highlight text={task.name} query={searchQuery} />
                        </h3>
                        {ms && <Icons.Flag size={12} className="shrink-0 mt-[2px] text-amber-500" />}
                      </div>

                      <div className="mt-auto space-y-1.5">
                        <div className="flex items-center justify-between text-[10px] tabular-nums text-gray-500 dark:text-gray-400">
                          <span>{formatDate(task.start)}</span>
                          <span className="text-gray-300 dark:text-gray-600">→</span>
                          <span>{formatDate(task.end)}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          <div className="flex-1 h-1.5 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden">
                            <div className={`h-full rounded-full ${crit ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: pct + '%' }} />
                          </div>
                          <span className="text-[10px] font-medium text-gray-500 dark:text-gray-400 tabular-nums w-7 text-right">{pct}%</span>
                        </div>
                        <div className="flex items-center justify-between text-[9px] text-gray-400 dark:text-gray-500">
                          <span>{ms ? '里程碑' : durationOf(task) + ' 天'}</span>
                          <span>{marked ? '★ 关键 · ' : ''}前{(task.dependencies || []).length}/后{succCount}</span>
                        </div>
                      </div>
                    </div>

                    {/* 连线手柄 */}
                    <div className="absolute right-[-8px] top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-white dark:bg-gray-700 border-2 border-blue-500 cursor-crosshair hover:scale-125 transition-all z-20 shadow flex items-center justify-center"
                         style={{ opacity: isHover || isConnect ? 1 : 0 }}
                         onMouseDown={(e) => onConnectorDown(e, task.id)}
                         title="拖动到另一个节点，建立依赖关系">
                      <div className="w-1.5 h-1.5 bg-blue-500 rounded-full pointer-events-none" />
                    </div>
                  </div>
                );
              })}

              {/* 吸附参考线 */}
              {snapLines && snapLines.x !== undefined && (
                <div className="absolute w-px bg-rose-400/80 z-40 pointer-events-none"
                     style={{ left: snapLines.x, top: -10000, height: 20000 }} />
              )}
              {snapLines && snapLines.y !== undefined && (
                <div className="absolute h-px bg-rose-400/80 z-40 pointer-events-none"
                     style={{ top: snapLines.y, left: -10000, width: 20000 }} />
              )}
            </div>

            {/* 工具条 */}
            <div className="absolute top-2.5 right-2.5 flex items-center gap-0.5 bg-white/95 dark:bg-gray-800/95 backdrop-blur rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm px-1 py-1 z-40"
                 onMouseDown={(e) => e.stopPropagation()}>
              <button onClick={() => onTaskLayout()} title="自动布局（按依赖层级重新排布）"
                      className="px-2 py-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 flex items-center gap-1 text-[11px] transition">
                <Icons.LayoutGrid size={13} /> 自动布局
              </button>
              <button onClick={fitView} title="适应视图"
                      className="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition">
                <Icons.Maximize2 size={13} />
              </button>
              <div className="w-px h-4 bg-gray-200 dark:bg-gray-700 mx-0.5" />
              <button onClick={() => { const r = containerRef.current.getBoundingClientRect(); zoomAt(1 / 1.15, r.left + r.width / 2, r.top + r.height / 2); }}
                      className="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition" title="缩小">
                <Icons.ZoomOut size={13} />
              </button>
              <span className="text-[10px] tabular-nums text-gray-500 dark:text-gray-400 w-9 text-center">{Math.round(zoom * 100)}%</span>
              <button onClick={() => { const r = containerRef.current.getBoundingClientRect(); zoomAt(1.15, r.left + r.width / 2, r.top + r.height / 2); }}
                      className="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition" title="放大">
                <Icons.ZoomIn size={13} />
              </button>
              <button onClick={resetView} title="重置视图"
                      className="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition">
                <Icons.RotateCcw size={13} />
              </button>
            </div>

            {/* 图例 */}
            <div className="absolute bottom-3 left-3 flex items-center gap-3 text-[10px] text-gray-500 dark:text-gray-400 bg-white/85 dark:bg-gray-800/85 backdrop-blur px-2.5 py-1.5 rounded-md border border-gray-200 dark:border-gray-700 pointer-events-none z-30">
              <span className="flex items-center gap-1"><span className="w-4 h-0 border-t-2 border-dashed border-slate-400 inline-block" /> 依赖关系</span>
              {showCritical && <span className="flex items-center gap-1"><span className="w-4 h-0 border-t-2 border-rose-500 inline-block" /> 关键线路</span>}
              <span className="flex items-center gap-1"><span className="w-[10px] h-[10px] rotate-45 rounded-[2px] bg-amber-400 inline-block" /> 里程碑</span>
              <span className="text-gray-400 dark:text-gray-500">拖动空白平移 · Ctrl+滚轮缩放</span>
            </div>
          </div>
        );
      };

      // ============================================================
      // 10. 初始数据（示例：地铁车站 BAS / 门禁系统施工进度）
      //     日期相对"今天"生成，方便直接看到进度与"今天"标记线
      // ============================================================
      const T0 = startOfDay(new Date());
      const D = (offset) => addDays(T0, offset);

      // critical: true = 该任务为「关键工作」（可在任务表「关键」列勾选 / 取消）
      const INITIAL_TASKS = [
        { id: 't1', name: '施工准备', content: '场地移交、材料报审、技术交底', start: D(-14), end: D(-12), progress: 100, dependencies: [], critical: true, order: 0 },
        { id: 't2', name: '预埋管与桥架安装', content: 'BAS 桥架敷设、预埋管疏通', start: D(-11), end: D(-4), progress: 85, dependencies: ['t1'], critical: true, order: 1 },
        { id: 't3', name: '线缆敷设与端接', content: '网线、电源线敷设及端接', start: D(-3), end: D(4), progress: 60, dependencies: ['t2'], order: 2 },
        { id: 't4', name: 'BAS 设备安装', content: '温湿度/CO 传感器、DDC 箱、执行器', start: D(-3), end: D(5), progress: 35, dependencies: ['t2'], critical: true, order: 3 },
        { id: 't5', name: '门禁设备安装', content: '读卡器、电锁、门磁、就地控制器', start: D(-3), end: D(4), progress: 20, dependencies: ['t2'], order: 4 },
        { id: 't6', name: '单机调试', content: '点对点校线、单体功能测试', start: D(6), end: D(10), progress: 0, dependencies: ['t3', 't4', 't5'], critical: true, order: 5 },
        { id: 't7', name: '系统联调', content: '与综合监控联调、消防联动试验', start: D(11), end: D(17), progress: 0, dependencies: ['t6'], critical: true, order: 6 },
        { id: 't8', name: '竣工验收', content: '资料移交、预验收问题整改闭环', start: D(18), end: D(18), progress: 0, dependencies: ['t7'], milestone: true, critical: true, order: 7 },
      ];

      const VIEW_MODES = [
        { value: 'Day', label: '日' },
        { value: 'Week', label: '周' },
        { value: 'Month', label: '月' },
      ];

      // 导出前把内部滚动容器"撑开"，解决长图被裁切的问题
      const expandForExport = (el) => {
        const styles = [];
        const scrolls = [];
        const nodes = [el].concat(Array.from(el.querySelectorAll('*')));
        const setStyle = (node, prop, val) => {
          styles.push([node, prop, node.style[prop]]);
          node.style[prop] = val;
        };

        // 1) 归零滚动 + 展开 overflow
        nodes.forEach((node) => {
          if (node.scrollTop || node.scrollLeft) {
            scrolls.push([node, node.scrollTop, node.scrollLeft]);
            node.scrollTop = 0;
            node.scrollLeft = 0;
          }
          const cs = window.getComputedStyle(node);
          if (/hidden|auto|scroll/.test(cs.overflow + cs.overflowX + cs.overflowY)) {
            setStyle(node, 'overflow', 'visible');
            setStyle(node, 'overflowX', 'visible');
            setStyle(node, 'overflowY', 'visible');
          }
        });

        // 2) 自底向上按真实内容尺寸撑开（先子后父）
        for (let i = nodes.length - 1; i >= 1; i--) {
          const n = nodes[i];
          if (n.scrollWidth > n.clientWidth + 1) {
            setStyle(n, 'width', n.scrollWidth + 'px');
            setStyle(n, 'flex', 'none');
          }
          if (n.scrollHeight > n.clientHeight + 1) {
            setStyle(n, 'height', n.scrollHeight + 'px');
          }
        }

        // 3) 计算整体内容外框并撑开根元素
        const rootRect = el.getBoundingClientRect();
        let right = rootRect.right, bottom = rootRect.bottom;
        nodes.forEach((n) => {
          const r = n.getBoundingClientRect();
          if (r.width || r.height) {
            if (r.right > right) right = r.right;
            if (r.bottom > bottom) bottom = r.bottom;
          }
        });
        const fullW = Math.max(1, Math.ceil(right - rootRect.left));
        const fullH = Math.max(1, Math.ceil(bottom - rootRect.top));
        setStyle(el, 'width', fullW + 'px');
        setStyle(el, 'height', fullH + 'px');
        setStyle(el, 'flex', 'none');

        return {
          fullW,
          fullH,
          restore: () => {
            for (let i = styles.length - 1; i >= 0; i--) {
              const [node, prop, val] = styles[i];
              node.style[prop] = val;
            }
            scrolls.forEach(([node, top, left]) => { node.scrollTop = top; node.scrollLeft = left; });
          },
        };
      };

      // ============================================================
      // 11. 主应用
      // ============================================================
      const App = () => {
        const [tasks, setTasks] = useState(() => calculateNetworkLayout(INITIAL_TASKS));
        const [viewMode, setViewMode] = useState('Day');
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [currentTask, setCurrentTask] = useState(undefined);
        const [searchQuery, setSearchQuery] = useState('');
        const [darkMode, setDarkMode] = useState(() => !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
        const [projectTitle, setProjectTitle] = useState('地铁车站 BAS 及门禁系统工程进度计划');
        const [showCritical, setShowCritical] = useState(true);
        // 当前主视图：'gantt' = 施工进度计划图，'network' = 网络计划图（两视图共用同一份 tasks，切换不重置数据）
        const [activeView, setActiveView] = useState('gantt');
        // 任务表列宽 / 侧栏宽度提升到 App，切换视图后不丢失
        const [sidebarWidth, setSidebarWidth] = useState(640);
        const [colWidths, setColWidths] = useState({ index: 44, name: 176, content: 132, start: 88, end: 88, duration: 56, critical: 56 });
        const [exportOpen, setExportOpen] = useState(false);
        const [toast, setToast] = useState(null);
        const [confirmState, setConfirmState] = useState(null);

        const titleRef = useRef(null);
        const toastTimer = useRef(null);

        const schedule = useMemo(() => computeCritical(tasks), [tasks]);

        const showToast = useCallback((message, type = 'info') => {
          setToast({ message, type });
          if (toastTimer.current) clearTimeout(toastTimer.current);
          toastTimer.current = setTimeout(() => setToast(null), type === 'error' ? 3800 : 2200);
        }, []);

        // 主题
        useEffect(() => {
          document.documentElement.classList.toggle('dark', darkMode);
        }, [darkMode]);

        // 标题输入框高度自适应
        useEffect(() => {
          const el = titleRef.current;
          if (!el) return;
          el.style.height = 'auto';
          el.style.height = el.scrollHeight + 'px';
        }, [projectTitle]);

        // 点击外部关闭导出菜单
        useEffect(() => {
          if (!exportOpen) return;
          const close = () => setExportOpen(false);
          window.addEventListener('click', close);
          return () => window.removeEventListener('click', close);
        }, [exportOpen]);

        // ---------- 数据操作 ----------
        const handleTaskUpdate = useCallback((updated) => {
          setTasks((prev) => prev.map((t) => (t.id === updated.id ? { ...t, ...updated } : t)));
        }, []);

        const handleSaveTask = (data) => {
          if (currentTask) {
            setTasks((prev) => prev.map((t) => (t.id === currentTask.id
              ? { ...t, ...data, start: new Date(data.start), end: new Date(data.end) }
              : t)));
            showToast('任务已更新', 'success');
          } else {
            const maxOrder = tasks.reduce((m, t) => Math.max(m, t.order == null ? -1 : t.order), -1);
            const firstDep = (data.dependencies || [])[0];
            const depTask = firstDep ? tasks.find((t) => t.id === firstDep) : null;
            const lastTask = tasks[tasks.length - 1];
            const newTask = {
              id: generateId(),
              name: data.name || '新任务',
              content: data.content || '',
              start: new Date(data.start || new Date()),
              end: new Date(data.end || data.start || new Date()),
              progress: data.progress || 0,
              dependencies: data.dependencies || [],
              milestone: !!data.milestone,
              critical: !!data.critical,
              order: maxOrder + 1,
              networkX: depTask ? depTask.networkX + NODE_W + GAP_X : (lastTask ? lastTask.networkX + 40 : 40),
              networkY: depTask ? depTask.networkY : (lastTask ? lastTask.networkY + NODE_H + GAP_Y : 40),
            };
            setTasks((prev) => [...prev, newTask]);
            showToast('任务已创建，可在网络图中点「自动布局」整理', 'success');
          }
          setCurrentTask(undefined);
        };

        const doDeleteTask = (id) => {
          setTasks((prev) => prev
            .filter((t) => t.id !== id)
            .map((t) => (t.dependencies || []).includes(id)
              ? { ...t, dependencies: t.dependencies.filter((d) => d !== id) }
              : t));
          showToast('任务已删除', 'success');
        };

        const askDeleteTask = (id) => {
          const t = tasks.find((x) => x.id === id);
          if (!t) return;
          setConfirmState({
            title: '删除任务',
            message: `确定要删除「${t.name}」吗？\n其他任务对它的依赖关系会同时解除。`,
            confirmText: '删除',
            onConfirm: () => doDeleteTask(id),
          });
        };

        const handleReorderTasks = (sourceId, targetId) => {
          setTasks((prev) => {
            const list = [...prev].sort((a, b) => (a.order || 0) - (b.order || 0));
            const si = list.findIndex((t) => t.id === sourceId);
            const ti = list.findIndex((t) => t.id === targetId);
            if (si === -1 || ti === -1) return prev;
            const [moved] = list.splice(si, 1);
            list.splice(ti, 0, moved);
            return list.map((t, i) => ({ ...t, order: i }));
          });
        };

        const handleMoveTask = (id, direction) => {
          setTasks((prev) => {
            const list = [...prev].sort((a, b) => (a.order || 0) - (b.order || 0));
            const i = list.findIndex((t) => t.id === id);
            if (i === -1) return prev;
            if (direction === 'up' && i > 0) {
              const tmp = list[i]; list[i] = list[i - 1]; list[i - 1] = tmp;
            } else if (direction === 'down' && i < list.length - 1) {
              const tmp = list[i]; list[i] = list[i + 1]; list[i + 1] = tmp;
            }
            return list.map((t, idx) => ({ ...t, order: idx }));
          });
        };

        const handleAutoLayout = () => {
          setTasks((prev) => autoLayoutNetwork(prev));
          showToast('已按依赖层级重新布局', 'success');
        };

        // ---------- 搜索 ----------
        const filteredTasks = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          if (!q) return tasks;
          return tasks.filter((t) =>
            (t.name || '').toLowerCase().includes(q) ||
            (t.content || '').toLowerCase().includes(q));
        }, [tasks, searchQuery]);

        const dimmedIds = useMemo(() => {
          if (!searchQuery.trim()) return null;
          const keep = new Set(filteredTasks.map((t) => t.id));
          return new Set(tasks.filter((t) => !keep.has(t.id)).map((t) => t.id));
        }, [tasks, filteredTasks, searchQuery]);

        // ---------- 统计 ----------
        const stats = useMemo(() => {
          if (!tasks.length) return { count: 0, duration: 0, progress: 0, start: null, end: null };
          let minS = Infinity, maxE = -Infinity;
          tasks.forEach((t) => {
            minS = Math.min(minS, startOfDay(t.start).getTime());
            maxE = Math.max(maxE, startOfDay(t.end).getTime());
          });
          const totalDur = tasks.reduce((s, t) => s + durationOf(t), 0);
          const done = tasks.reduce((s, t) => s + (t.progress || 0) * durationOf(t), 0);
          return {
            count: tasks.length,
            duration: Math.max(1, Math.round((maxE - minS) / MS_DAY) + 1),
            progress: totalDur ? Math.round(done / totalDur) : 0,
            start: new Date(minS),
            end: new Date(maxE),
          };
        }, [tasks]);

        // ---------- 导出 ----------
        // 目标容器不在当前视图时：先切到对应视图，等它挂载完成再截图（数据不受影响）
        const waitForElement = (id, timeout = 2500) => new Promise((resolve) => {
          const t0 = Date.now();
          const tick = () => {
            const node = document.getElementById(id);
            if (node) return resolve(node);
            if (Date.now() - t0 > timeout) return resolve(null);
            setTimeout(tick, 50);
          };
          tick();
        });

        const exportImage = async (targetId, type, baseName) => {
          if (!window.html2canvas) { showToast('导出组件尚未加载完成，请检查网络后重试', 'error'); return; }
          const needView = targetId === 'network-export-area' ? 'network' : 'gantt';
          let el = document.getElementById(targetId);
          if (!el) {
            setActiveView(needView);
            el = await waitForElement(targetId);
          }
          if (!el) { showToast('目标视图未能加载，请重试', 'error'); return; }
          showToast('正在生成图片，请稍候…', 'info');
          const ctx = expandForExport(el);
          try {
            const canvas = await window.html2canvas(el, {
              scale: 2,
              backgroundColor: darkMode ? '#191919' : '#ffffff',
              width: ctx.fullW,
              height: ctx.fullH,
              windowWidth: ctx.fullW + 40,
              windowHeight: ctx.fullH + 40,
              scrollX: 0,
              scrollY: 0,
              useCORS: true,
              logging: false,
            });

            const stamp = formatDate(new Date()).replace(/-/g, '');
            if (type === 'png') {
              const a = document.createElement('a');
              a.download = `${baseName}-${stamp}.png`;
              a.href = canvas.toDataURL('image/png');
              a.click();
            } else {
              const jsPDF = window.jspdf && window.jspdf.jsPDF;
              if (!jsPDF) { showToast('PDF 组件尚未加载完成', 'error'); return; }
              const pdf = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
              const pw = pdf.internal.pageSize.getWidth();
              const ph = pdf.internal.pageSize.getHeight();
              const k = pw / canvas.width;
              const pagePx = Math.max(1, Math.floor(ph / k));
              let y = 0, page = 0;
              while (y < canvas.height) {
                const sliceH = Math.min(pagePx, canvas.height - y);
                const c = document.createElement('canvas');
                c.width = canvas.width;
                c.height = sliceH;
                const g = c.getContext('2d');
                g.fillStyle = darkMode ? '#191919' : '#ffffff';
                g.fillRect(0, 0, c.width, c.height);
                g.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
                if (page > 0) pdf.addPage();
                pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, sliceH * k);
                y += sliceH;
                page += 1;
              }
              pdf.save(`${baseName}-${stamp}.pdf`);
            }
            showToast('导出完成', 'success');
          } catch (err) {
            console.error(err);
            showToast('导出失败：' + (err && err.message ? err.message : '未知错误'), 'error');
          } finally {
            ctx.restore();
          }
        };

        // ---------- 渲染 ----------
        return (
          <div className="flex flex-col h-screen w-full bg-notion-bg dark:bg-notion-bgDark text-gray-900 dark:text-gray-100 overflow-hidden">

            {/* 标题 + 概览 */}
            <div className="shrink-0 bg-white dark:bg-notion-sidebarDark pt-4 pb-2.5 z-40">
              <textarea
                ref={titleRef}
                value={projectTitle}
                onChange={(e) => setProjectTitle(e.target.value)}
                rows={1}
                placeholder="输入工程名称"
                className="block text-xl font-bold text-center bg-transparent border-none resize-none overflow-hidden w-full max-w-3xl mx-auto text-gray-800 dark:text-white placeholder-gray-300 leading-tight"
                style={{ minHeight: '32px' }}
              />
              <div className="mt-1.5 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[11px] text-gray-400 dark:text-gray-500">
                <span>共 <b className="text-gray-600 dark:text-gray-300 font-semibold">{stats.count}</b> 项任务</span>
                <span className="text-gray-300 dark:text-gray-700">|</span>
                <span>计划周期 <b className="text-gray-600 dark:text-gray-300 font-semibold">{stats.duration}</b> 天</span>
                <span className="text-gray-300 dark:text-gray-700">|</span>
                <span>总完成率 <b className="text-blue-600 dark:text-blue-400 font-semibold">{stats.progress}%</b></span>
                {showCritical && (
                  <React.Fragment>
                    <span className="text-gray-300 dark:text-gray-700">|</span>
                    <span className="text-rose-500">关键工作 <b className="font-semibold">{schedule.critical.size}</b> 项</span>
                  </React.Fragment>
                )}
                {stats.start && (
                  <React.Fragment>
                    <span className="text-gray-300 dark:text-gray-700">|</span>
                    <span className="tabular-nums">{formatDate(stats.start)} ~ {formatDate(stats.end)}</span>
                  </React.Fragment>
                )}
              </div>
              <div className="mt-2 mx-auto max-w-3xl h-1 rounded-full bg-gray-100 dark:bg-gray-800 overflow-hidden">
                <div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500" style={{ width: stats.progress + '%' }} />
              </div>
            </div>

            {/* 工具栏 */}
            <header className="flex flex-wrap items-center justify-between gap-y-2 px-5 py-2.5 border-y border-notion-border dark:border-notion-borderDark bg-white dark:bg-notion-sidebarDark shadow-sm z-30 shrink-0">
              <div className="flex items-center gap-3">
                <div className="p-1.5 bg-blue-600 rounded-lg shadow-md shadow-blue-600/25">
                  <Icons.Monitor size={17} className="text-white" />
                </div>
                <h1 className="text-sm font-bold tracking-tight whitespace-nowrap">施工进度计划</h1>

                <div className="ml-4 flex items-center bg-gray-100 dark:bg-gray-800 rounded-lg px-2.5 py-1.5 border border-transparent focus-within:border-blue-400 focus-within:bg-white dark:focus-within:bg-gray-900 transition-all">
                  <Icons.Search size={13} className="text-gray-400 mr-1.5 shrink-0" />
                  <input
                    className="bg-transparent border-none outline-none text-xs w-36 placeholder-gray-400"
                    placeholder="搜索任务…"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="ml-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" title="清空">
                      <Icons.X size={12} />
                    </button>
                  )}
                </div>
                {searchQuery.trim() && (
                  <span className="text-[11px] text-gray-500 dark:text-gray-400">
                    命中 <b className="text-blue-600 dark:text-blue-400">{filteredTasks.length}</b>/{tasks.length}
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2">
                {/* 日 / 周 / 月（仅进度计划图有效）—— 位于「网络计划图」按钮左侧 */}
                {activeView === 'gantt' && (
                  <div className="flex bg-gray-100 dark:bg-gray-800 rounded-lg p-0.5">
                    {VIEW_MODES.map((mode) => (
                      <button key={mode.value}
                              onClick={() => setViewMode(mode.value)}
                              title={VIEW_MODE_CONFIG[mode.value].tip}
                              className={`w-8 py-1 text-xs font-medium rounded-md transition-all ${viewMode === mode.value ? 'bg-white dark:bg-gray-600 shadow-sm text-blue-600 dark:text-blue-300' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'}`}>
                        {mode.label}
                      </button>
                    ))}
                  </div>
                )}

                {/* 主视图切换：施工进度计划图 ⇄ 网络计划图 */}
                <button onClick={() => setActiveView((v) => (v === 'network' ? 'gantt' : 'network'))}
                        title={activeView === 'network' ? '切换回「施工进度计划图」' : '切换到「网络计划图」（与进度计划共用同一份数据，切换不会重置）'}
                        className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${activeView === 'network'
                          ? 'bg-blue-50 text-blue-600 border-blue-200 dark:bg-blue-500/15 dark:text-blue-300 dark:border-blue-500/30'
                          : 'text-gray-500 border-gray-200 hover:bg-gray-50 dark:text-gray-400 dark:border-gray-700 dark:hover:bg-gray-800'}`}>
                  <Icons.Network size={13} /> 网络计划图
                </button>

                {/* 关键路径开关 */}
                <button onClick={() => setShowCritical((v) => !v)}
                        title="显示 / 隐藏关键工作标注（在任务表「关键」列勾选）"
                        className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${showCritical
                          ? 'bg-rose-50 text-rose-600 border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/30'
                          : 'text-gray-500 border-gray-200 hover:bg-gray-50 dark:text-gray-400 dark:border-gray-700 dark:hover:bg-gray-800'}`}>
                  <Icons.GitBranch size={13} /> 关键路径
                </button>

                <div className="h-5 w-px bg-gray-200 dark:bg-gray-700" />

                <button onClick={() => setDarkMode((v) => !v)}
                        className="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300 transition-colors"
                        title="切换深色 / 浅色">
                  {darkMode ? <Icons.Sun size={16} /> : <Icons.Moon size={16} />}
                </button>

                {/* 导出 */}
                <div className="relative">
                  <button onClick={(e) => { e.stopPropagation(); setExportOpen((v) => !v); }}
                          className={`flex items-center gap-1.5 px-3 py-1.5 border rounded-lg text-xs transition ${exportOpen
                            ? 'border-blue-300 bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-300 dark:border-blue-500/40'
                            : 'border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800'}`}>
                    <Icons.Download size={13} /> 导出
                    <Icons.ChevronDown size={12} />
                  </button>
                  {exportOpen && (
                    <div className="animate-pop absolute right-0 top-full mt-1.5 w-44 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-xl py-1 z-50"
                         onClick={(e) => e.stopPropagation()}>
                      <div className="px-3 py-1 text-[10px] font-semibold text-gray-400 uppercase">施工进度计划图</div>
                      <button onClick={() => { setExportOpen(false); exportImage('gantt-export-area', 'png', '施工进度甘特图'); }}
                              className="w-full text-left px-3 py-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                        <Icons.Image size={12} /> 导出 PNG 长图
                      </button>
                      <button onClick={() => { setExportOpen(false); exportImage('gantt-export-area', 'pdf', '施工进度甘特图'); }}
                              className="w-full text-left px-3 py-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                        <Icons.FileText size={12} /> 导出 PDF（自动分页）
                      </button>
                      <div className="h-px bg-gray-100 dark:bg-gray-700 my-1" />
                      <div className="px-3 py-1 text-[10px] font-semibold text-gray-400 uppercase">网络计划图</div>
                      <button onClick={() => { setExportOpen(false); exportImage('network-export-area', 'png', '网络计划图'); }}
                              className="w-full text-left px-3 py-1.5 text-xs hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                        <Icons.Image size={12} /> 导出 PNG
                      </button>
                    </div>
                  )}
                </div>

                <button onClick={() => { setCurrentTask(undefined); setIsModalOpen(true); }}
                        className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-md shadow-blue-600/20 transition active:scale-95">
                  <Icons.Plus size={14} /> 新建任务
                </button>
              </div>
            </header>

            {/* 主体：施工进度计划图 / 网络计划图 二选一全屏显示（数据共用） */}
            <div className="flex-1 flex flex-col min-h-0 relative">
              {activeView === 'gantt' ? (
                <div className="flex-1 min-h-0 flex flex-col">
                  <GanttChart
                    tasks={filteredTasks}
                    viewMode={viewMode}
                    onTaskUpdate={handleTaskUpdate}
                    onEditTask={(task) => { setCurrentTask(task || undefined); setIsModalOpen(true); }}
                    onReorderTasks={handleReorderTasks}
                    onMoveTask={handleMoveTask}
                    onDeleteTask={askDeleteTask}
                    schedule={schedule}
                    showCritical={showCritical}
                    searchQuery={searchQuery}
                    sidebarWidth={sidebarWidth}
                    setSidebarWidth={setSidebarWidth}
                    colWidths={colWidths}
                    setColWidths={setColWidths}
                  />
                </div>
              ) : (
                <div className="flex-1 min-h-0 flex flex-col bg-gray-50 dark:bg-canvasDark">
                  <div className="px-4 py-1.5 text-xs font-semibold text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800/70 border-b border-notion-border dark:border-notion-borderDark flex items-center gap-2 shrink-0">
                    <Icons.Network size={13} />
                    网络计划图
                    <span className="font-normal text-gray-400 dark:text-gray-500">
                      （双击节点编辑 · 拖动右侧圆点连线 · 空白处拖动平移 · 数据与进度计划图同步）
                    </span>
                  </div>
                  <div className="flex-1 relative overflow-hidden" id="network-export-area">
                    <NetworkDiagram
                      tasks={tasks}
                      onTaskUpdate={handleTaskUpdate}
                      onEditTask={(task) => { setCurrentTask(task); setIsModalOpen(true); }}
                      onTaskLayout={handleAutoLayout}
                      schedule={schedule}
                      showCritical={showCritical}
                      searchQuery={searchQuery}
                      dimmedIds={dimmedIds}
                      onToast={showToast}
                    />
                  </div>
                </div>
              )}
            </div>

            <TaskModal
              isOpen={isModalOpen}
              onClose={() => { setIsModalOpen(false); setCurrentTask(undefined); }}
              onSave={handleSaveTask}
              task={currentTask}
              allTasks={tasks}
              onDelete={askDeleteTask}
            />

            <ConfirmDialog state={confirmState} onClose={() => setConfirmState(null)} />
            <Toast toast={toast} />
          </div>
        );
      };

      // ============================================================
      // 12. 挂载
      // ============================================================
      createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
